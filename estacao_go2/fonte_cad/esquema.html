<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #ffffff; font-family: "DejaVu Sans", Arial, sans-serif; }
  svg text { font-family: "DejaVu Sans", Arial, sans-serif; }
</style></head>
<body>
<svg id="esq" xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <rect width="1600" height="1060" fill="#ffffff"/>
  <text x="40" y="58" font-size="34" font-weight="bold" fill="#1d2430">Esquema elétrico da estação (sem solda)</text>
  <text x="40" y="94" font-size="19" fill="#5b6573">Só encaixes: plugues P4, USB-C, jumpers dupont e borne de parafuso. Tudo alimentado pelo nobreak de 12 V.</text>

  <!-- ===== Nobreak ===== -->
  <rect x="40" y="150" width="230" height="130" rx="10" fill="#eef0f3" stroke="#1d2430" stroke-width="2"/>
  <text x="155" y="200" font-size="22" font-weight="bold" fill="#1d2430" text-anchor="middle">Nobreak</text>
  <text x="155" y="228" font-size="18" fill="#1d2430" text-anchor="middle">Qualitronix 12 V 1 A</text>
  <text x="155" y="256" font-size="15" fill="#5b6573" text-anchor="middle">(já tem)</text>
  <!-- tomada -->
  <path d="M40 215 L 10 215" stroke="#1d2430" stroke-width="5" fill="none"/>

  <!-- cable from nobreak to Y -->
  <path d="M270 215 L 330 215" stroke="#222" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Y cable body -->
  <rect x="330" y="202" width="34" height="26" rx="5" fill="#333"/>
  <text x="347" y="190" font-size="15" fill="#5b6573" text-anchor="middle">P4 fêmea</text>
  <path d="M364 215 L 420 215" stroke="#222" stroke-width="7" fill="none"/>
  <circle cx="420" cy="215" r="9" fill="#222"/>
  <path d="M420 215 C 470 215, 470 150, 520 150 L 600 150" stroke="#222" stroke-width="7" fill="none"/>
  <path d="M420 215 C 470 215, 470 330, 520 330 L 560 330 L 560 470" stroke="#222" stroke-width="7" fill="none"/>
  <text x="430" y="122" font-size="20" font-weight="bold" fill="#1d2430">Cabo Y P4</text>
  <text x="430" y="144" font-size="15" fill="#5b6573">1 fêmea → 2 machos</text>
  <!-- branch A plug into adapter jack -->
  <rect x="600" y="140" width="40" height="20" rx="4" fill="#333"/>
  <path d="M640 150 L 700 150 L 700 560 L 760 560" stroke="#222" stroke-width="7" fill="none"/>
  <rect x="760" y="548" width="28" height="24" rx="4" fill="#333"/>
  <text x="726" y="420" font-size="15" fill="#1d2430" transform="rotate(-90 726 420)" text-anchor="middle">P4 → entrada 12 V</text>

  <!-- ===== Conex P4 femea com borne ===== -->
  <rect x="535" y="470" width="50" height="64" rx="6" fill="#26282c"/>
  <rect x="535" y="534" width="50" height="34" rx="3" fill="#3aa35a"/>
  <circle cx="548" cy="551" r="7" fill="#d8e9dd"/><circle cx="572" cy="551" r="7" fill="#d8e9dd"/>
  <text x="548" y="590" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">+</text>
  <text x="572" y="590" font-size="18" font-weight="bold" fill="#1d2430" text-anchor="middle">−</text>
  <text x="300" y="490" font-size="18" font-weight="bold" fill="#1d2430">Conex 1000</text>
  <text x="300" y="513" font-size="15" fill="#5b6573">P4 fêmea com borne</text>
  <text x="300" y="534" font-size="15" fill="#5b6573">(confira + e − com o</text>
  <text x="300" y="553" font-size="15" fill="#5b6573">multímetro: ≈ 12 V)</text>
  <!-- wires to converter -->
  <path d="M548 558 L 548 640 L 470 640 L 470 700" stroke="#c62828" stroke-width="5" fill="none"/>
  <path d="M572 558 L 572 655 L 500 655 L 500 700" stroke="#111" stroke-width="5" fill="none"/>
  <text x="590" y="640" font-size="15" fill="#c62828">fio vermelho no +</text>
  <text x="590" y="662" font-size="15" fill="#1d2430">fio preto no −</text>

  <!-- ===== Converter ===== -->
  <rect x="400" y="700" width="170" height="90" rx="10" fill="#1f2125"/>
  <text x="485" y="738" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Conversor</text>
  <text x="485" y="764" font-size="16" fill="#e5e7eb" text-anchor="middle">12 V → 5 V 3 A</text>
  <text x="485" y="815" font-size="15" fill="#5b6573" text-anchor="middle">Riva ou CPT12-5C</text>
  <!-- USB-C cable to ESP32 -->
  <path d="M570 745 L 1325 745 L 1325 712" stroke="#2563eb" stroke-width="6" fill="none"/>
  <rect x="1314" y="690" width="22" height="24" rx="4" fill="#2563eb"/>
  <text x="800" y="735" font-size="16" fill="#2563eb" text-anchor="middle">plugue USB-C (5 V) direto no ESP32</text>

  <!-- ===== Bus Servo Adapter (A) ===== -->
  <rect x="760" y="330" width="360" height="270" rx="16" fill="#16181b" stroke="#000" stroke-width="2"/>
  <text x="940" y="625" font-size="20" font-weight="bold" fill="#1d2430" text-anchor="middle">Waveshare Bus Servo Adapter (A) V1.1</text>
  <!-- servo ports D V G -->
  <rect x="790" y="340" width="70" height="34" rx="3" fill="#f3efe6"/><rect x="880" y="340" width="70" height="34" rx="3" fill="#f3efe6"/>
  <text x="825" y="394" font-size="14" fill="#e5e7eb" text-anchor="middle">D V G</text><text x="915" y="394" font-size="14" fill="#e5e7eb" text-anchor="middle">D V G</text>
  <!-- UART header -->
  <rect x="990" y="342" width="96" height="30" rx="3" fill="#2b2d31" stroke="#9ca3af"/>
  <rect x="1004" y="351" width="12" height="12" fill="#d4d4d8"/><rect x="1032" y="351" width="12" height="12" fill="#d4d4d8"/><rect x="1060" y="351" width="12" height="12" fill="#d4d4d8"/>
  <text x="1010" y="392" font-size="14" fill="#e5e7eb" text-anchor="middle">TX</text><text x="1038" y="392" font-size="14" fill="#e5e7eb" text-anchor="middle">RX</text><text x="1066" y="392" font-size="14" fill="#e5e7eb" text-anchor="middle">GND</text>
  <text x="1038" y="412" font-size="13" fill="#e5e7eb" text-anchor="middle">UART</text>
  <!-- jumpers -->
  <text x="990" y="448" font-size="13" fill="#e5e7eb">A  UART ~ SERVO</text>
  <text x="990" y="468" font-size="13" fill="#e5e7eb">B  USB ~ SERVO</text>
  <rect x="1010" y="480" width="24" height="44" rx="3" fill="#2b2d31" stroke="#9ca3af"/><rect x="1040" y="480" width="24" height="44" rx="3" fill="#2b2d31" stroke="#9ca3af"/>
  <rect x="1012" y="482" width="20" height="20" rx="2" fill="#facc15"/><rect x="1042" y="482" width="20" height="20" rx="2" fill="#facc15"/>
  <text x="998" y="497" font-size="14" font-weight="bold" fill="#facc15" text-anchor="end">A</text>
  <text x="998" y="519" font-size="14" fill="#9ca3af" text-anchor="end">B</text>
  <text x="1076" y="497" font-size="13" fill="#facc15">os 2 em A</text>
  <!-- DC jack -->
  <rect x="772" y="535" width="44" height="50" rx="4" fill="#0b0b0c" stroke="#6b7280"/>
  <text x="796" y="528" font-size="11" fill="#e5e7eb" text-anchor="middle">DC 9~12.6V</text>
  <!-- green terminal + capacitor -->
  <rect x="840" y="548" width="64" height="38" rx="3" fill="#3aa35a"/>
  <circle cx="856" cy="567" r="9" fill="#d8e9dd"/><circle cx="888" cy="567" r="9" fill="#d8e9dd"/>
  <text x="851" y="541" font-size="11" fill="#e5e7eb" text-anchor="middle">DC+</text><text x="893" y="541" font-size="11" fill="#e5e7eb" text-anchor="middle">DC−</text>
  <line x1="856" y1="567" x2="856" y2="460" stroke="#b0b0b0" stroke-width="3"/>
  <line x1="888" y1="567" x2="888" y2="480" stroke="#b0b0b0" stroke-width="3"/>
  <rect x="840" y="420" width="64" height="60" rx="8" fill="#1e3a8a"/>
  <rect x="884" y="420" width="16" height="60" fill="#93c5fd"/>
  <text x="872" y="455" font-size="12" fill="#ffffff" text-anchor="middle">2200µF</text>
  <!-- USB-C unused -->
  <rect x="1040" y="560" width="40" height="22" rx="6" fill="#9ca3af"/>
  <text x="1060" y="550" font-size="12" fill="#e5e7eb" text-anchor="middle">USB (sem uso)</text>

  <!-- capacitor callout -->
  <path d="M840 448 L 525 400" stroke="#1d2430" stroke-width="1.2" fill="none"/>
  <rect x="225" y="360" width="300" height="80" rx="8" fill="#ffffff" stroke="#1d2430"/>
  <text x="240" y="386" font-size="16" font-weight="bold" fill="#1d2430">Capacitor 2200 µF 25 V</text>
  <text x="240" y="408" font-size="15" fill="#1d2430">perna longa no DC+</text>
  <text x="240" y="428" font-size="15" fill="#1d2430">lado da faixa clara no DC−</text>

  <!-- servo cable -->
  <path d="M825 340 L 825 270 L 900 270 L 900 230" stroke="#c62828" stroke-width="3" fill="none"/>
  <path d="M833 340 L 833 278 L 908 278 L 908 230" stroke="#111" stroke-width="3" fill="none"/>
  <path d="M817 340 L 817 262 L 892 262 L 892 230" stroke="#e5e7eb" stroke-width="3" fill="none"/>
  <rect x="820" y="140" width="170" height="90" rx="10" fill="#1f2125"/>
  <text x="905" y="180" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Servo</text>
  <text x="905" y="206" font-size="16" fill="#e5e7eb" text-anchor="middle">STS3215 12 V</text>

  <!-- ===== ESP32 DevKit ===== -->
  <rect x="1250" y="300" width="150" height="390" rx="10" fill="#111214" stroke="#000" stroke-width="2"/>
  <rect x="1275" y="450" width="100" height="110" rx="4" fill="#9ca3af"/>
  <text x="1325" y="510" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">ESP32</text>
  <rect x="1305" y="668" width="40" height="22" rx="6" fill="#9ca3af"/>
  <text x="1325" y="790" font-size="20" font-weight="bold" fill="#1d2430" text-anchor="middle">ESP32 DevKit</text>
  <text x="1325" y="813" font-size="15" fill="#5b6573" text-anchor="middle">30 pinos, USB-C, CP2102</text>
  <!-- left-side pins used -->
  <rect x="1242" y="343" width="14" height="14" fill="#d4d4d8"/><rect x="1242" y="371" width="14" height="14" fill="#d4d4d8"/><rect x="1242" y="399" width="14" height="14" fill="#d4d4d8"/>
  <text x="1264" y="590" font-size="13" fill="#e5e7eb">use os nomes</text>
  <text x="1264" y="608" font-size="13" fill="#e5e7eb">impressos na placa</text>
  <text x="1264" y="355" font-size="15" fill="#ffffff">TX2 (GPIO17)</text>
  <text x="1264" y="383" font-size="15" fill="#ffffff">RX2 (GPIO16)</text>
  <text x="1264" y="411" font-size="15" fill="#ffffff">GND</text>

  <!-- jumpers -->
  <path d="M1010 351 L 1010 300 L 1160 300 L 1160 350 L 1242 350" stroke="#eab308" stroke-width="5" fill="none"/>
  <path d="M1038 351 L 1038 285 L 1180 285 L 1180 378 L 1242 378" stroke="#16a34a" stroke-width="5" fill="none"/>
  <path d="M1066 351 L 1066 270 L 1200 270 L 1200 406 L 1242 406" stroke="#111" stroke-width="5" fill="none"/>

  <!-- legend -->
  <g transform="translate(40, 870)">
    <rect width="1520" height="160" rx="12" fill="#f7f8fa" stroke="#d1d5db"/>
    <line x1="24" y1="36" x2="70" y2="36" stroke="#eab308" stroke-width="5"/><text x="80" y="42" font-size="17" fill="#1d2430">TX2 (GPIO17) → TX da placa</text>
    <line x1="24" y1="72" x2="70" y2="72" stroke="#16a34a" stroke-width="5"/><text x="80" y="78" font-size="17" fill="#1d2430">RX2 (GPIO16) → RX da placa</text>
    <line x1="24" y1="108" x2="70" y2="108" stroke="#111" stroke-width="5"/><text x="80" y="114" font-size="17" fill="#1d2430">GND → GND (obrigatório)</text>
    <line x1="420" y1="36" x2="466" y2="36" stroke="#222" stroke-width="7"/><text x="476" y="42" font-size="17" fill="#1d2430">Cabos P4: 12 V</text>
    <line x1="420" y1="72" x2="466" y2="72" stroke="#2563eb" stroke-width="6"/><text x="476" y="78" font-size="17" fill="#1d2430">USB-C: 5 V para o ESP32</text>
    <line x1="420" y1="108" x2="466" y2="108" stroke="#c62828" stroke-width="5"/><text x="476" y="114" font-size="17" fill="#1d2430">Fio vermelho = positivo</text>
    <text x="820" y="40" font-size="17" font-weight="bold" fill="#1d2430">Antes de ligar</text>
    <text x="820" y="68" font-size="16" fill="#1d2430">1. Multímetro no P4 do nobreak: ≈ 12 V (máx. 12,6 V)</text>
    <text x="820" y="94" font-size="16" fill="#1d2430">2. Multímetro na saída do conversor: ≈ 5 V</text>
    <text x="820" y="120" font-size="16" fill="#1d2430">3. Os 2 jumpers amarelos na fileira A</text>
    <text x="820" y="146" font-size="16" fill="#1d2430">4. Servo não responde? Troque TX↔RX (ou a opção no firmware)</text>
  </g>
</svg>
</body></html>
